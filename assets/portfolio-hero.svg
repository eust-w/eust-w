<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Longtao Wu — Robotics, agents and research tools</title><desc id="desc">Two areas of work: physical-world data and simulation; agent-driven engineering and scientific research.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#18233f"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8da9c7" stroke-opacity=".07"/></pattern></defs><rect width="1280" height="420" rx="24" fill="url(#bg)"/><rect width="1280" height="420" rx="24" fill="url(#grid)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="48" y="58" fill="#65d9cf" font-size="14" letter-spacing="4">BUILDING TOOLS THAT CONNECT</text><text x="48" y="140" fill="#f4f7fc" font-size="64" font-weight="700" letter-spacing="-2">Longtao Wu</text><text x="48" y="185" fill="#bdcce0" font-size="24">Robotics. Agents. Research tooling.</text><rect x="48" y="244" width="568" height="126" rx="16" fill="#10283b" stroke="#265063"/><text x="72" y="277" fill="#65d9cf" font-size="13" letter-spacing="2">01 / PHYSICAL-WORLD COMPUTING</text><text x="72" y="316" fill="#f1f6fc" font-size="24" font-weight="600">Geometry → Data → Simulation</text><text x="72" y="346" fill="#afc1d7" font-size="16">Capture · Real2Sim · World schemas · Evaluation</text><rect x="640" y="244" width="592" height="126" rx="16" fill="#201f3d" stroke="#4c426e"/><text x="664" y="277" fill="#b5a0ff" font-size="13" letter-spacing="2">02 / AGENT-DRIVEN WORK</text><text x="664" y="316" fill="#f1f6fc" font-size="24" font-weight="600">Tools → Experiments → Evidence</text><text x="664" y="346" fill="#afc1d7" font-size="16">Embedded systems · Scientific workspaces · Developer tools</text></g><g fill="none" stroke-width="2"><circle cx="1090" cy="122" r="76" stroke="#65d9cf" opacity=".3"/><circ